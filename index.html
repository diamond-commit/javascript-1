
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-black text-white flex items-center justify-center p-4">

    <main class="w-full max-w-sm rounded-3xl bg-zinc-950 border border-zinc-800 p-4 sm:p-5 shadow-2xl">

    <!-- Display -->
        <div class="h-28 sm:h-32 px-3 py-4 flex flex-col justify-end items-end overflow-hidden">
            <div class="previous text-zinc-500 text-base sm:text-lg min-h-6">
            </div>

            <div class="current w-full text-right text-4xl sm:text-5xl font-light truncate">
                0
            </div>
        </div>

        <!-- Buttons -->
        <div class="grid grid-cols-4 gap-2 sm:gap-3">

            <!-- Row 1 -->
            <button class="h-16 sm:h-18 rounded-full bg-zinc-300 text-black text-lg sm:text-xl hover:bg-white active:scale-95 transition">
                AC
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-300 text-black text-lg sm:text-xl hover:bg-white active:scale-95 transition">
                %
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-300 text-black text-lg sm:text-xl hover:bg-white active:scale-95 transition">
                ⌫
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-white text-black text-xl hover:bg-zinc-200 active:scale-95 transition">
                ÷
            </button>

            <!-- Row 2 -->
            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                7
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                8
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                9
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-white text-black text-xl hover:bg-zinc-200 active:scale-95 transition">
                ×
            </button>

            <!-- Row 3 -->
            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                4
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                5
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                6
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-white text-black text-xl hover:bg-zinc-200 active:scale-95 transition">
                −
            </button>

            <!-- Row 4 -->
            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                1
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                2
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                3
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-white text-black text-xl hover:bg-zinc-200 active:scale-95 transition">
                +
            </button>

            <!-- Row 5 -->
            <button class="col-span-2 h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl text-left pl-7 hover:bg-zinc-800 active:scale-95 transition">
                0
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-zinc-900 text-white text-xl hover:bg-zinc-800 active:scale-95 transition">
                .
            </button>

            <button class="h-16 sm:h-18 rounded-full bg-white text-black text-xl hover:bg-zinc-200 active:scale-95 transition">
                =
            </button>

        </div>

    </main>
    <script src="script.jshttps://github.com/diamond-commit/javascript-calculator.git"></script>
</body>
</html>
